                - message: StorageUri is immutable
                  rule: self == oldSelf
            required:
            - modelSize
            - nodeGroups
            - sourceModelUri
            type: object
          status:
            properties:
              copies:
                properties:
                  available:
                    type: integer
                  failed:
                    type: integer
                  total:
                    type: integer
                type: object
              inferenceServices:
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  type: object
                type: array
              nodeStatus:
                additionalProperties:
                  enum:
                  - ""
                  - NodeNotReady
                  - NodeDownloadPending
                  - NodeDownloading
                  - NodeDownloaded
                  - NodeDownloadError
                  type: string
                type: object
            type: object
        type: object
